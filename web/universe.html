<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe Explorer — Drift</title>
<style>
/* Immersive drift — epistemic body forms, game camera feel, glass HUD */
:root {
  --est:#57C186; --strong:#6FA8E8; --comp:#D9B14A; --front:#E8794E; --spec:#D66BB4;
  --ink:#F5F5F7; --muted:#8E9AAB; --panel:rgba(12,14,22,.72); --line:rgba(255,255,255,.12);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; background:#03050A;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased; }
#space { position:fixed; inset:0; display:block; cursor:grab; touch-action:none; }
#space.drag { cursor:grabbing; }
#vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse 75% 70% at 50% 45%, transparent 40%,
    rgba(0,0,0,.55) 100%); }
.hud { position:fixed; z-index:10; }
#brand { top:22px; left:24px; pointer-events:none; max-width:min(420px,70vw); }
#brand h1 { font:600 1.45rem/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",
  Georgia,"Songti SC",serif; letter-spacing:-.02em;
  text-shadow:0 2px 24px rgba(0,0,0,.85); }
#brand p { color:var(--muted); font-size:.8rem; margin-top:6px; line-height:1.4;
  text-shadow:0 1px 12px rgba(0,0,0,.8); }
#nav { top:18px; right:18px; display:flex; gap:8px; flex-wrap:wrap;
  justify-content:flex-end; max-width:min(62vw,720px); }
.btn { border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:980px; padding:7px 15px; font:inherit; font-size:.78rem;
  font-weight:500; cursor:pointer; backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  transition:transform .25s var(--ease-out), border-color .2s, background .2s; }
.btn:hover { border-color:rgba(255,255,255,.28); transform:scale(1.04);
  background:rgba(22,26,38,.85); }
.btn.on { border-color:var(--est); font-weight:700; }
#hint { bottom:20px; left:50%; transform:translateX(-50%); color:var(--muted);
  font-size:.74rem; background:var(--panel); border:1px solid var(--line);
  border-radius:980px; padding:7px 18px; pointer-events:none; opacity:.92;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  letter-spacing:.02em; }
#legend { bottom:18px; left:18px; font-size:.7rem; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:10px 14px; display:grid; gap:4px;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
#legend i { display:inline-block; width:9px; height:9px; border-radius:50%;
  margin-right:7px; vertical-align:middle; }
#panel { position:fixed; top:0; right:0; height:100%; width:min(460px,96vw);
  background:rgba(10,12,20,.82); backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  border-left:1px solid var(--line); z-index:20; transform:translateX(104%);
  overflow-y:auto; padding:26px 24px 70px;
  box-shadow:-20px 0 50px rgba(0,0,0,.4); }
#panel.open { transform:translateX(0); }
@media (prefers-reduced-motion: no-preference) {
  #panel { transition:transform .48s var(--ease-out); }
  .btn { transition:transform .25s var(--ease-out), border-color .2s, background .2s; }
}
#panel h2 { font:600 1.35rem/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",
  Georgia,"Songti SC",serif; margin:10px 0 8px; letter-spacing:-.02em;
  text-wrap:balance; }
#panel h3 { font-size:.68rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:0 0 8px; font-weight:600; }
#panel ul { padding-left:16px; }
#panel li { margin:7px 0; font-size:.86rem; line-height:1.45; }
.p-sec { margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
  opacity:0; transform:translateY(12px); }
.p-sec.vis { opacity:1; transform:none;
  transition:opacity .5s var(--ease-out), transform .5s var(--ease-out); }
@media (prefers-reduced-motion: reduce) {
  .p-sec { opacity:1; transform:none; }
}
#intro { position:fixed; inset:0; z-index:30; pointer-events:none;
  background:#000; opacity:1; transition:opacity 1.4s var(--ease-out); }
#intro.gone { opacity:0; }
#soundbtn.btn { min-width:2.6em; }
.badge { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.7rem;
  background:rgba(255,255,255,.07); border-radius:8px; padding:3px 9px;
  color:var(--muted); }
.cond { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.7rem;
  display:block; color:var(--est); font-weight:600; }
.note { color:var(--muted); }
.ref { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.68rem;
  color:var(--muted); }
.tier { font-size:.62em; font-weight:700; border:1px solid currentColor;
  border-radius:4px; padding:0 4px; opacity:.75; }
#closep { float:right; border:1px solid var(--line); background:rgba(255,255,255,.06);
  color:var(--ink); border-radius:980px; font:inherit; font-size:.78rem;
  font-weight:500; padding:6px 14px; cursor:pointer;
  transition:transform .2s var(--ease-out); }
#closep:hover { transform:scale(1.05); }
.plinks { margin-top:18px; font-size:.84rem; display:flex; gap:16px;
  flex-wrap:wrap; font-weight:500; }
.plinks a { color:var(--est); text-decoration:none; }
.plinks a:hover { opacity:.8; }
button:focus-visible, a:focus-visible { outline:2px solid var(--est);
  outline-offset:3px; }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="intro" aria-hidden="true"></div>
<div class="hud" id="brand"><h1 id="t-title"></h1><p id="t-sub"></p></div>
<div class="hud" id="nav"></div>
<div class="hud" id="legend"></div>
<div class="hud" id="hint"></div>
<aside id="panel" aria-label="claim detail"></aside>

<script>
"use strict";
const COLORS = { ESTABLISHED:"#57C186", STRONG:"#6FA8E8", COMPETING:"#D9B14A",
  FRONTIER:"#E8794E", SPECULATIVE:"#D66BB4" };
const I18N = {
  en: { title:"Universe Explorer",
    sub:"Drift through verified knowledge. Every star costs a source — the dark is honest.",
    hint:"Drag to drift  ·  Scroll to zoom  ·  Click a body",
    overview:"Overview", lang:"中文", map:"Map view", plain:"Plain site",
    whylight:"Why this light", evidence:"Evidence",
    open:"Open questions", sources:"Sources", close:"close",
    diverge:"axes diverge", permalink:"permalink",
    challenge:"challenge this verdict",
    legend:["star — established","planet — strong","binary — two camps",
            "nebula — frontier","ghost — speculative","pulse — ⚡ divergence",
            "moon — a verified source"],
    uncharted:"uncharted", unchartedTitle:"Not yet charted",
    unchartedBody:"Nothing is drawn here because nothing has been verified here. Every body in this universe costs a real, fetched, hash-checked source — emptiness is not a bug, it is the honest report of how much work knowing takes. Want this region mapped? Suggest a domain:",
    suggest:"suggest a domain →",
    soundOn:"🔊", soundOff:"🔇" },
  zh: { title:"宇宙探索者",
    sub:"漂流過已核實的知識。每顆天體都以出處為代價 —— 黑暗是誠實的。",
    hint:"拖曳漂移  ·  滾輪縮放  ·  點擊天體",
    overview:"總覽", lang:"EN", map:"地圖視圖", plain:"陽春版",
    whylight:"為什麼是這個燈號", evidence:"證據",
    open:"開放問題", sources:"出處", close:"關閉",
    diverge:"雙軸分岔", permalink:"永久連結",
    challenge:"挑戰這個判定",
    legend:["恆星 —— 已確立","行星 —— 強共識","雙星 —— 兩派拉鋸",
            "星雲 —— 前沿","幽靈 —— 推測","脈動 —— ⚡ 分岔",
            "衛星 —— 一筆經核實的出處"],
    uncharted:"未測繪", unchartedTitle:"尚未測繪",
    unchartedBody:"這裡什麼都沒畫,因為這裡還沒有任何東西被核實過。這個宇宙裡每顆天體都要價一筆真實、已抓取、雜湊驗證過的出處 —— 空曠不是缺陷,是「知道」要花多少工的誠實報告。想讓這片區域被測繪?提議一個領域:",
    suggest:"提議一個領域 →",
    soundOn:"🔊", soundOff:"🔇" },
};

let DATA = null, bodies = [], clusters = [];
const UNCHARTED = [ {x:0,y:-1500}, {x:2320,y:220}, {x:-2380,y:160}, {x:60,y:1660} ];
let state = { lang:"en", sel:null, expandId:null };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let expandT = 0; // 0..1 animated expand factor

const cv = document.getElementById("space");
const cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  // some webviews report a 0 viewport for the first frames — never trust it
  W = innerWidth || document.documentElement.clientWidth || 960;
  H = innerHeight || document.documentElement.clientHeight || 600;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* camera */
const cam = { x:0, y:0, z:4.2, vx:0, vy:0 };
let fly = null;
let introBH = { active:true, life:1 }; // pull back from black hole
// overview must FIT the viewport, whatever its size — never a fixed zoom
function overviewZ() {
  return Math.max(0.17, Math.min(0.8, Math.min(W / 4600, H / 3100)));
}
function flyTo(x, y, z, dur) {
  if (REDUCED) { cam.x = x; cam.y = y; cam.z = z; return; }
  fly = { fx:cam.x, fy:cam.y, fz:cam.z, tx:x, ty:y, tz:z, t:0, dur:dur || 1.15 };
}

/* soft ambient — muted by default, procedural (no asset files) */
const AudioFX = (() => {
  let ctx = null, master = null, muted = true, drone = null;
  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
  }
  function setMuted(m) {
    muted = m;
    ensure();
    if (!master || !ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(muted ? 0 : 0.11, t, 0.12);
    if (!muted) startDrone(); else stopDrone();
  }
  function startDrone() {
    if (!ctx || drone || muted) return;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    o1.type = "sine"; o2.type = "triangle";
    o1.frequency.value = 48; o2.frequency.value = 72;
    f.type = "lowpass"; f.frequency.value = 220;
    g.gain.value = 0.05;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start();
    drone = { o1, o2 };
  }
  function stopDrone() {
    if (!drone) return;
    try { drone.o1.stop(); drone.o2.stop(); } catch (_) {}
    drone = null;
  }
  function blip() {
    if (muted) return;
    ensure();
    if (!ctx || !master) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(380, t);
    o.frequency.exponentialRampToValueAtTime(140, t + 0.22);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.3);
  }
  return {
    isMuted: () => muted,
    toggle() { setMuted(!muted); return muted; },
    blip,
    unlock() { ensure(); if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); },
  };
})();

/* deterministic pseudo-random (stable layout per claim) */
function rnd(seed) { let s = 0;
  for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) % 2147483647;
  return () => (s = s * 16807 % 2147483647) / 2147483647; }

/* starfield layers + dust */
const stars = [], dust = [], galaxies = [];
{ const r = rnd("starfield");
  for (let L = 0; L < 4; L++)
    for (let i = 0; i < 420; i++)
      stars.push({ x:r()*9600-4800, y:r()*6400-3200, l:0.1+L*0.24,
        s:0.4+r()*(L+1)*0.7, tw:r()*6.28, ts:0.3+r()*1.2 });
  for (let i = 0; i < 220; i++)
    dust.push({ x:r()*9600-4800, y:r()*6400-3200, s:0.6+r()*1.7,
      dx:(r()-0.5)*7, dy:(r()-0.5)*7, a:0.05+r()*0.12 });
  for (let i = 0; i < 16; i++)
    galaxies.push({ x:r()*9000-4500, y:r()*6000-3000, rx:60+r()*150,
      ry:22+r()*46, rot:r()*3.14, a:0.05+r()*0.06,
      hue:["199,224,234","234,214,199","214,199,234"][i % 3] });
}

/* layout: each topic = a constellation cluster, grouped by theme */
function layout() {
  // theme regions: cosmos (NW), planets (NE), earth (S)
  const themeAnchor = {
    cosmos:  { x:-900,  y:-720 },
    planets: { x: 1100, y:-640 },
    earth:   { x:  80,  y: 980 },
  };
  const offset = {
    cosmology:[-420,-140], dark_matter:[80,-220], black_hole:[480,40],
    stars:[-80,200],
    planets:[-280,-40], exoplanets:[320,120],
    ocean:[-360,40], seismology:[340,-80],
  };
  clusters = DATA.topics.map((t) => {
    const th = t.theme || "cosmos";
    const base = themeAnchor[th] || themeAnchor.cosmos;
    const off = offset[t.id] || [0, 0];
    return { ...t, x: base.x + off[0], y: base.y + off[1] };
  });
  bodies = [];
  for (const c of clusters) {
    const cl = DATA.claims.filter(k => k.topic === c.id);
    const r = rnd(c.id);
    const spread = 150 + Math.min(cl.length, 18) * 8;
    cl.forEach((k, i) => {
      const ang = (i / Math.max(cl.length, 1)) * 6.283 + r() * 0.8;
      const dist0 = 140 + r() * spread;
      bodies.push({ c:k, cl:c,
        ang, dist0,
        bx:c.x + Math.cos(ang) * dist0, by:c.y + Math.sin(ang) * dist0 * 0.72,
        x:0, y:0, ph:r() * 6.283, sp:0.25 + r() * 0.5,
        size:24 - k.axis_rank * 3.6,   // size = evidence strength
        orb:r() * 6.283,
        // every verified source is a real moon — density that cost provenance
        moons:k.sources.map((s, mi) => ({ label:s.label, tier:s.tier,
          d:(24 - k.axis_rank*3.6) + 13 + mi*8, sp:0.35 + r()*0.5,
          ph:r()*6.283 })) });
    });
  }
}
function expandCluster(id) {
  const c = clusters.find(x => x.id === id);
  if (!c) return;
  const was = state.expandId === id;
  state.expandId = was ? null : id;
  AudioFX.unlock(); AudioFX.blip();
  if (state.expandId) flyTo(c.x, c.y, 1.35, 1.0);
  else flyTo(0, 30, overviewZ(), 1.0);
  renderHud();
}

/* draw one epistemic body */
function drawBody(b, t, hov) {
  const k = b.c, col = COLORS[k.status], s = b.size;
  const x = b.x, y = b.y;
  cx.save();
  if (k.diverges) {                      // divergence: pulsing ring
    const p = REDUCED ? 0.5 : (Math.sin(t*2.1 + b.ph) + 1) / 2;
    cx.beginPath(); cx.arc(x, y, s + 8 + p*6, 0, 6.283);
    cx.strokeStyle = col; cx.globalAlpha = 0.35 + p*0.3; cx.lineWidth = 1.5;
    cx.setLineDash([4,5]); cx.stroke(); cx.setLineDash([]); cx.globalAlpha = 1;
  }
  cx.shadowColor = col;
  if (k.status === "ESTABLISHED") {      // star: solid, steady glow
    cx.shadowBlur = 26;
    cx.fillStyle = col; cx.beginPath(); cx.arc(x, y, s, 0, 6.283); cx.fill();
    cx.shadowBlur = 0; cx.fillStyle = "rgba(255,255,255,.85)";
    cx.beginPath(); cx.arc(x - s*0.28, y - s*0.28, s*0.3, 0, 6.283); cx.fill();
  } else if (k.status === "STRONG") {    // planet: calm, ringed
    cx.shadowBlur = 14; cx.fillStyle = col;
    cx.beginPath(); cx.arc(x, y, s, 0, 6.283); cx.fill(); cx.shadowBlur = 0;
    cx.strokeStyle = "rgba(255,255,255,.35)"; cx.lineWidth = 1.4;
    cx.beginPath(); cx.ellipse(x, y, s*1.65, s*0.5, -0.45, 0, 6.283); cx.stroke();
  } else if (k.status === "COMPETING") { // binary: two camps orbiting
    const a = REDUCED ? b.orb : t * b.sp + b.orb, d = s * 0.95;
    for (const sgn of [1, -1]) {
      cx.shadowBlur = 12; cx.fillStyle = col;
      cx.beginPath();
      cx.arc(x + Math.cos(a)*d*sgn, y + Math.sin(a)*d*0.55*sgn, s*0.62, 0, 6.283);
      cx.fill();
    }
    cx.shadowBlur = 0; cx.strokeStyle = col; cx.globalAlpha = 0.3;
    cx.beginPath(); cx.ellipse(x, y, d*1.15, d*0.68, 0, 0, 6.283); cx.stroke();
    cx.globalAlpha = 1;
  } else if (k.status === "FRONTIER") {  // nebula: still coalescing
    const g = cx.createRadialGradient(x, y, 1, x, y, s*1.9);
    g.addColorStop(0, col + "E6"); g.addColorStop(0.55, col + "55");
    g.addColorStop(1, col + "00");
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, s*1.9, 0, 6.283); cx.fill();
    const r2 = rnd(k.id);
    for (let i = 0; i < 7; i++) {
      const aa = (REDUCED ? 0 : t * (0.2 + r2()*0.4)) + r2()*6.283;
      const dd = s * (0.8 + r2()*1.1);
      cx.globalAlpha = 0.6; cx.fillStyle = col;
      cx.beginPath();
      cx.arc(x + Math.cos(aa)*dd, y + Math.sin(aa)*dd*0.8, 1.6, 0, 6.283);
      cx.fill(); cx.globalAlpha = 1;
    }
  } else {                                // SPECULATIVE ghost: flickering
    const f = REDUCED ? 0.55 : 0.35 + ((Math.sin(t*3.1 + b.ph) + 1) / 2) * 0.4;
    cx.globalAlpha = f; cx.shadowBlur = 18; cx.strokeStyle = col;
    cx.lineWidth = 1.6; cx.setLineDash([5,4]);
    cx.beginPath(); cx.arc(x, y, s, 0, 6.283); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = col; cx.globalAlpha = f * 0.35;
    cx.beginPath(); cx.arc(x, y, s, 0, 6.283); cx.fill();
    cx.globalAlpha = 1;
  }
  cx.shadowBlur = 0;
  for (const m of b.moons) {              // moons = verified sources
    const ma = (REDUCED ? 0 : t * m.sp) + m.ph;
    const mx = x + Math.cos(ma) * m.d, my = y + Math.sin(ma) * m.d * 0.62;
    cx.globalAlpha = 0.85; cx.fillStyle = "#B9C7D2";
    cx.beginPath();
    cx.arc(mx, my, m.tier === "PRIMARY" ? 2.6 : 2.0, 0, 6.283); cx.fill();
    cx.globalAlpha = 1;
    if (cam.z > 1.5) {
      cx.font = "9px ui-monospace, monospace";
      cx.fillStyle = "rgba(185,199,210,.6)"; cx.textAlign = "center";
      cx.fillText(m.label, mx, my - 5);
    }
  }
  if (hov || cam.z > 1.05) {              // label on hover or close zoom
    cx.font = (hov ? "600 " : "") + "12px system-ui";
    cx.fillStyle = hov ? "#FFFFFF" : "rgba(220,230,224,.75)";
    cx.textAlign = "center";
    const title = state.lang === "zh" ? k.title_zh : k.title;
    cx.fillText(title.length > 34 ? title.slice(0, 33) + "…" : title,
                x, y + s + (k.status === "FRONTIER" ? s : 0) + 18);
  }
  cx.restore();
}

let hover = null, tPrev = 0;
function frame(ms) {
  const t = ms / 1000;
  // late-arriving viewport (0-width first frames): keep checking cheaply
  const liveW = innerWidth || document.documentElement.clientWidth || 960;
  const liveH = innerHeight || document.documentElement.clientHeight || 600;
  if (liveW !== W || liveH !== H) resize();
  if (fly) {
    fly.t = Math.min(1, fly.t + (ms - tPrev) / ((fly.dur || 1.15) * 1000));
    // smoothstep * ease-out expo feel
    const u = fly.t;
    const e = u * u * u * (u * (u * 6 - 15) + 10); // smootherstep
    cam.x = fly.fx + (fly.tx - fly.fx) * e;
    cam.y = fly.fy + (fly.ty - fly.fy) * e;
    cam.z = fly.fz + (fly.tz - fly.fz) * e;
    if (fly.t >= 1) fly = null;
  } else if (!drag.on) {
    cam.x += cam.vx; cam.y += cam.vy;
    cam.vx *= 0.94; cam.vy *= 0.94;
    if (Math.abs(cam.vx) < 0.002) cam.vx = 0;
    if (Math.abs(cam.vy) < 0.002) cam.vy = 0;
  }
  tPrev = ms;

  // deep space gradient
  const bg = cx.createRadialGradient(W*0.5, H*0.42, 0, W*0.5, H*0.5, Math.max(W,H)*0.75);
  bg.addColorStop(0, "#0A1020"); bg.addColorStop(0.55, "#05080F"); bg.addColorStop(1, "#020308");
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

  for (const g of galaxies) {            // distant galaxies, deepest parallax
    const gx = (g.x - cam.x * 0.07) * cam.z + W/2;
    const gy = (g.y - cam.y * 0.07) * cam.z + H/2;
    if (gx < -260 || gx > W+260 || gy < -260 || gy > H+260) continue;
    cx.save(); cx.translate(gx, gy); cx.rotate(g.rot);
    const gg = cx.createRadialGradient(0, 0, 1, 0, 0, g.rx * cam.z);
    gg.addColorStop(0, "rgba(" + g.hue + "," + (g.a*2.2) + ")");
    gg.addColorStop(1, "rgba(" + g.hue + ",0)");
    cx.fillStyle = gg; cx.scale(1, g.ry / g.rx);
    cx.beginPath(); cx.arc(0, 0, g.rx * cam.z, 0, 6.283); cx.fill();
    cx.restore();
  }
  for (const u of UNCHARTED) {           // the honest dark: not yet charted
    const ux = (u.x - cam.x) * cam.z + W/2, uy = (u.y - cam.y) * cam.z + H/2;
    if (ux < -600 || ux > W+600 || uy < -600 || uy > H+600) continue;
    const ur = 430 * cam.z;
    const ug = cx.createRadialGradient(ux, uy, 1, ux, uy, ur);
    ug.addColorStop(0, "rgba(130,150,160,.07)");
    ug.addColorStop(1, "rgba(130,150,160,0)");
    cx.fillStyle = ug; cx.beginPath(); cx.arc(ux, uy, ur, 0, 6.283); cx.fill();
    cx.font = "500 " + Math.max(11, 13*cam.z) + "px Georgia, Songti SC, serif";
    cx.fillStyle = "rgba(160,180,190,.38)"; cx.textAlign = "center";
    cx.fillText(L().uncharted, ux, uy);
  }

  for (const s of stars) {               // parallax starfield
    const sx = (s.x - cam.x * s.l) * cam.z + W/2;
    const sy = (s.y - cam.y * s.l) * cam.z + H/2;
    if (sx < -8 || sx > W+8 || sy < -8 || sy > H+8) continue;
    const tw = REDUCED ? 0.75 : 0.55 + 0.45 * Math.sin(t * s.ts + s.tw);
    cx.globalAlpha = 0.35 * tw + s.l * 0.35;
    cx.fillStyle = "#CFE0EA";
    cx.beginPath(); cx.arc(sx, sy, s.s * (0.6 + s.l), 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  for (const d of dust) {                // suspended dust, slow drift
    if (!REDUCED) { d.x += d.dx * 0.016; d.y += d.dy * 0.016;
      if (d.x > 4800) d.x = -4800; if (d.x < -4800) d.x = 4800;
      if (d.y > 3200) d.y = -3200; if (d.y < -3200) d.y = 3200; }
    const sx = (d.x - cam.x * 0.9) * cam.z + W/2;
    const sy = (d.y - cam.y * 0.9) * cam.z + H/2;
    if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
    cx.globalAlpha = d.a; cx.fillStyle = "#9FB8C8";
    cx.beginPath(); cx.arc(sx, sy, d.s * cam.z, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1;

  // animate expand factor
  const targetExp = state.expandId ? 1 : 0;
  expandT += (targetExp - expandT) * (REDUCED ? 1 : 0.06);

  for (const b of bodies) {              // ambient bobbing + cluster expand
    const isExp = state.expandId && b.cl.id === state.expandId;
    const isDim = state.expandId && b.cl.id !== state.expandId;
    const mult = 1 + (isExp ? expandT * 1.35 : 0);
    const dist = b.dist0 * mult;
    b.bx = b.cl.x + Math.cos(b.ang) * dist;
    b.by = b.cl.y + Math.sin(b.ang) * dist * 0.72;
    b.wx = b.bx + (REDUCED ? 0 : Math.sin(t * b.sp + b.ph) * 9);
    b.wy = b.by + (REDUCED ? 0 : Math.cos(t * b.sp * 0.8 + b.ph) * 7);
    b.x = (b.wx - cam.x) * cam.z + W/2;
    b.y = (b.wy - cam.y) * cam.z + H/2;
    b._dim = isDim ? 0.22 + (1 - expandT) * 0.78 : 1;
  }
  for (const c of clusters) {            // constellation lines + name
    const mem = bodies.filter(b => b.cl === c);
    const isExp = state.expandId === c.id;
    const isOther = state.expandId && !isExp;
    cx.globalAlpha = isOther ? 0.2 : 1;
    cx.strokeStyle = isExp ? "rgba(180,210,255,.35)" : "rgba(150,175,190,.16)";
    cx.lineWidth = isExp ? 1.6 : 1;
    cx.beginPath();
    mem.forEach((b, i) => i ? cx.lineTo(b.x, b.y) : cx.moveTo(b.x, b.y));
    cx.stroke();
    const sx = (c.x - cam.x) * cam.z + W/2, sy = (c.y - cam.y) * cam.z + H/2;
    const fs = Math.max(13, (isExp ? 18 : 15) * cam.z);
    cx.font = (isExp ? "600 " : "500 ") + fs + "px -apple-system, Georgia, Songti SC, serif";
    cx.fillStyle = isExp ? "rgba(230,240,255,.92)" : "rgba(190,205,212,.55)";
    cx.textAlign = "center";
    const label = (state.lang === "zh" ? c.title_zh : c.title)
      + (isExp ? "  ·" : "");
    cx.fillText(label, sx, sy);
    if (isExp) {
      cx.font = Math.max(10, 11 * cam.z) + "px system-ui";
      cx.fillStyle = "rgba(180,200,220,.7)";
      const n = mem.length;
      cx.fillText(n + (state.lang === "zh" ? " 則宣稱 · 點天體閱讀" : " claims · click a body"),
        sx, sy + fs * 1.15);
    }
    cx.globalAlpha = 1;
    c._sx = sx; c._sy = sy; c._hitR = Math.max(40, 55 * cam.z);
  }
  // dim non-expanded bodies slightly
  for (const b of bodies) {
    if (b._dim < 1) { /* applied in draw via globalAlpha wrapper */ }
  }
  const sc = [...bodies].sort((a, b) => a === hover ? 1 : b === hover ? -1 : 0);
  for (const b of sc) {
    cx.save();
    cx.globalAlpha = b._dim != null ? b._dim : 1;
    drawBody(b, t, b === hover);
    cx.restore();
  }

  // intro black hole (pull-back from event horizon)
  if (introBH.active || introBH.life > 0.01) {
    const life = introBH.life;
    const hx = (0 - cam.x) * cam.z + W/2, hy = (0 - cam.y) * cam.z + H/2;
    const hr = Math.max(W, H) * (0.55 + (1 - life) * 0.15) / Math.max(cam.z, 0.15);
    const g = cx.createRadialGradient(hx, hy, 0, hx, hy, hr);
    g.addColorStop(0, "rgba(0,0,0," + (0.98 * life) + ")");
    g.addColorStop(0.35, "rgba(8,4,20," + (0.75 * life) + ")");
    g.addColorStop(0.7, "rgba(40,20,80," + (0.25 * life) + ")");
    g.addColorStop(1, "rgba(0,0,0,0)");
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(hx, hy, hr, 0, 6.283); cx.fill();
    // photon ring
    cx.strokeStyle = "rgba(255,180,120," + (0.35 * life) + ")";
    cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(hx, hy, hr * 0.42, 0, 6.283); cx.stroke();
    if (!introBH.active) introBH.life = Math.max(0, life - 0.012);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* input: drag / momentum / wheel zoom / hover / click */
const drag = { on:false, x:0, y:0, moved:0 };
cv.addEventListener("pointerdown", e => { drag.on = true; drag.moved = 0;
  drag.x = e.clientX; drag.y = e.clientY; cam.vx = cam.vy = 0; fly = null;
  cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (drag.on) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    cam.vx = -dx / cam.z * 0.35; cam.vy = -dy / cam.z * 0.35;
    drag.x = e.clientX; drag.y = e.clientY; }
  else { hover = null;
    for (const b of bodies) {
      const hitR = Math.max(16, (b.size + 10) * cam.z);
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < hitR) hover = b; }
    cv.style.cursor = hover ? "pointer" : "grab"; } });
cv.addEventListener("pointerup", e => { drag.on = false;
  cv.classList.remove("drag");
  if (drag.moved < 6) {                   // click, not drag
    let hit = null;
    for (const b of bodies) {
      const hitR = Math.max(16, (b.size + 10) * cam.z);
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < hitR) hit = b; }
    if (hit) { openPanel(hit.c); return; }
    // click constellation label → expand / collapse domain
    for (const c of clusters) {
      if (c._sx == null) continue;
      if (Math.hypot(e.clientX - c._sx, e.clientY - c._sy) < (c._hitR || 50)) {
        expandCluster(c.id); return; } }
    for (const u of UNCHARTED) {
      const ux = (u.x - cam.x) * cam.z + W/2, uy = (u.y - cam.y) * cam.z + H/2;
      if (Math.hypot(e.clientX - ux, e.clientY - uy) < 300 * cam.z) {
        openUncharted(); return; } }
    closePanel(); } });
cv.addEventListener("wheel", e => { e.preventDefault();
  fly = null;
  const f = Math.exp(-e.deltaY * 0.00105);
  const z2 = Math.min(2.6, Math.max(0.22, cam.z * f));
  const wx = (e.clientX - W/2) / cam.z + cam.x;
  const wy = (e.clientY - H/2) / cam.z + cam.y;
  cam.x = wx - (e.clientX - W/2) / z2; cam.y = wy - (e.clientY - H/2) / z2;
  cam.z = z2; }, { passive:false });

/* panel (condensed record; full record lives one link away) */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = () => I18N[state.lang];
function sec(title, body) {
  return body
    ? `<div class="p-sec"><h3>${esc(title)}</h3>${body}</div>`
    : "";
}
function revealSecs() {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  [...$("panel").querySelectorAll(".p-sec")].forEach((el, i) => {
    if (reduced) el.classList.add("vis");
    else setTimeout(() => el.classList.add("vis"), 70 + i * 65);
  });
}
function openPanel(k) {
  state.sel = k; const t = L(), zh = state.lang === "zh";
  AudioFX.unlock(); AudioFX.blip();
  const reasons = k.status_reason.map(r => `<li>
    <span class="cond">${r.holds ? "✓" : "✗"} ${esc(zh ? r.condition_zh : r.condition)}</span>
    <span class="note">${esc(zh ? r.note_zh : r.note)}</span></li>`).join("");
  const ev = k.evidence.map(e => `<li><span class="badge">${esc(zh ? e.type_zh : e.type)}</span>
    ${esc(zh ? e.description_zh : e.description)} <span class="ref">[${esc(e.source_ref)}]</span></li>`).join("");
  const oq = (zh ? k.open_questions_zh : k.open_questions)
    .map(q => `<li>${esc(q)}</li>`).join("");
  const src = k.sources.map(s => `<li><b>${esc(s.label)}</b>
    <span class="tier">${esc(s.tier || "?")}</span> — ${esc(s.url_or_id)}</li>`).join("");
  $("panel").innerHTML = `
    <button id="closep">${esc(t.close)} ✕</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span style="font-size:1.5em">${k.status_light}</span>
      <span class="badge" style="color:${COLORS[k.status]};font-weight:700">
        ${esc(zh ? k.status_name_zh : k.status_name)}</span>
      <span class="badge">${esc(k.axis)} · ${esc(zh ? k.axis_name_zh : k.axis_name)}</span>
      ${k.diverges ? `<span class="badge" style="color:#D9B14A">⚡ ${esc(t.diverge)}</span>` : ""}
    </div>
    <h2>${esc(zh ? k.title_zh : k.title)}</h2>
    ${sec(t.whylight, `<ul>${reasons}</ul>`)}
    ${sec(t.evidence, `<ul>${ev}</ul>`)}
    ${sec(t.open, `<ul>${oq}</ul>`)}
    ${sec(t.sources, `<ul>${src}</ul>`)}
    <div class="plinks p-sec">
      <a href="${esc(k.permalink)}">${esc(t.permalink)} →</a>
      <a href="https://github.com/taipei49314/universe-explorer/issues/new?template=challenge-a-verdict.yml&title=%5Bchallenge%5D%20${esc(k.id)}">${esc(t.challenge)} →</a>
    </div>`;
  $("panel").classList.add("open");
  $("closep").addEventListener("click", closePanel);
  requestAnimationFrame(() => revealSecs());
}
function openUncharted() {
  const t = L();
  AudioFX.blip();
  $("panel").innerHTML = `
    <button id="closep">${esc(t.close)} ✕</button>
    <h2>${esc(t.unchartedTitle)}</h2>
    <div class="p-sec vis"><p class="note" style="margin-top:10px">${esc(t.unchartedBody)}</p>
    <div class="plinks"><a href="https://github.com/taipei49314/universe-explorer/issues/new">${esc(t.suggest)}</a></div></div>`;
  $("panel").classList.add("open");
  $("closep").addEventListener("click", closePanel);
}
function closePanel() { state.sel = null; $("panel").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

/* HUD */
function renderHud() {
  const t = L();
  document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
  document.title = t.title + " — Drift";
  $("t-title").textContent = t.title; $("t-sub").textContent = t.sub;
  $("hint").textContent = t.hint;
  $("legend").innerHTML = [
    `<span><i style="background:${COLORS.ESTABLISHED}"></i>${esc(t.legend[0])}</span>`,
    `<span><i style="background:${COLORS.STRONG}"></i>${esc(t.legend[1])}</span>`,
    `<span><i style="background:${COLORS.COMPETING}"></i>${esc(t.legend[2])}</span>`,
    `<span><i style="background:${COLORS.FRONTIER}"></i>${esc(t.legend[3])}</span>`,
    `<span><i style="background:${COLORS.SPECULATIVE}"></i>${esc(t.legend[4])}</span>`,
    `<span><i style="background:transparent;border:1px dashed ${COLORS.COMPETING}"></i>${esc(t.legend[5])}</span>`,
    `<span><i style="background:#B9C7D2"></i>${esc(t.legend[6])}</span>`,
  ].join("");
  const nav = [`<button class="btn" data-a="home">${esc(t.overview)}</button>`];
  for (const c of clusters)
    nav.push(`<button class="btn" data-a="c:${esc(c.id)}">
      ${esc(state.lang === "zh" ? c.title_zh : c.title)}</button>`);
  nav.push(`<button class="btn" id="soundbtn" type="button" title="ambient (default off)">${esc(AudioFX.isMuted() ? t.soundOff : t.soundOn)}</button>`);
  nav.push(`<button class="btn" id="langbtn">${esc(t.lang)}</button>`);
  nav.push(`<a class="btn" href="app.html">${esc(t.map)}</a>`);
  nav.push(`<a class="btn" href="index.html">${esc(t.plain)}</a>`);
  $("nav").innerHTML = nav.join("");
  $("nav").querySelectorAll("button[data-a]").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.a === "home") {
        state.expandId = null; flyTo(0, 30, overviewZ()); renderHud();
      } else {
        // expand domain (stars, cosmology, …) then fly in
        expandCluster(b.dataset.a.slice(2));
      } }));
  // highlight expanded domain button
  if (state.expandId) {
    const on = $("nav").querySelector(`button[data-a="c:${CSS.escape(state.expandId)}"]`);
    if (on) on.classList.add("on");
  }
  $("soundbtn").addEventListener("click", () => {
    AudioFX.unlock();
    AudioFX.toggle();
    $("soundbtn").textContent = AudioFX.isMuted() ? t.soundOff : t.soundOn;
  });
  $("langbtn").addEventListener("click", () => {
    state.lang = state.lang === "zh" ? "en" : "zh";
    renderHud(); if (state.sel) openPanel(state.sel); });
}

function runIntro() {
  // start inside the event horizon, pull back to overview
  cam.x = 0; cam.y = 0; cam.z = REDUCED ? overviewZ() : 5.2;
  introBH.active = !REDUCED;
  introBH.life = 1;
  const el = $("intro");
  if (REDUCED) {
    el.classList.add("gone");
    flyTo(0, 30, overviewZ(), 0.01);
    introBH.active = false; introBH.life = 0;
    return;
  }
  requestAnimationFrame(() => {
    el.classList.add("gone");
    flyTo(0, 30, overviewZ(), 2.4);
    setTimeout(() => { introBH.active = false; }, 900);
  });
}

fetch("app-data.json").then(r => r.json()).then(d => {
  DATA = d; layout(); renderHud(); runIntro();
});
</script>
