<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe Explorer — Knowledge Map</title>
<style>
/* Apple-smooth + game HUD — CVD-safe status colors preserved */
:root {
  --bg:#F5F5F7; --panel:rgba(255,255,255,.72); --panel-solid:#FFFFFF;
  --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(0,0,0,.08);
  --accent:#0071E3; --mono-bg:rgba(0,0,0,.04);
  --est:#2F7D46; --strong:#2762A8; --comp:#A17C0A; --front:#C13E2A; --spec:#93265E;
  --band:rgba(0,0,0,.03); --divzone:rgba(193,62,42,.06);
  --shadow:0 8px 32px rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.6) inset;
  --ease:cubic-bezier(.25,.1,.25,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --blur:20px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#000000; --panel:rgba(28,28,30,.78); --panel-solid:#1C1C1E;
  --ink:#F5F5F7; --muted:#98989D; --line:rgba(255,255,255,.1);
  --accent:#0A84FF; --mono-bg:rgba(255,255,255,.06);
  --est:#3E9E5C; --strong:#4C89CC; --comp:#A99312; --front:#D0512F; --spec:#C04E96;
  --band:rgba(255,255,255,.04); --divzone:rgba(208,81,47,.1);
  --shadow:0 12px 40px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06) inset;
}}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang TC","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  min-height:100vh; }
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,113,227,.12), transparent 55%),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(47,125,70,.08), transparent 50%),
    radial-gradient(ellipse 50% 30% at 50% 100%, rgba(147,38,94,.06), transparent 45%);
}
@media (prefers-color-scheme: dark) { body::before {
  background:
    radial-gradient(ellipse 70% 45% at 15% 0%, rgba(10,132,255,.18), transparent 55%),
    radial-gradient(ellipse 55% 35% at 95% 15%, rgba(62,158,92,.1), transparent 50%),
    radial-gradient(ellipse 40% 25% at 50% 100%, rgba(192,78,150,.08), transparent 45%);
}}
a { color:var(--accent); text-decoration:none; transition:opacity .2s var(--ease); }
a:hover { opacity:.75; }
header, main, footer { position:relative; z-index:1; }
header { max-width:1100px; margin:0 auto; padding:48px 24px 0; }
h1 { font:600 2.35rem/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Songti SC","Noto Serif CJK TC",serif;
  margin:0 0 8px; letter-spacing:-.03em; }
.sub { color:var(--muted); margin:0 0 8px; font-size:1.05rem; max-width:38em;
  line-height:1.45; font-weight:400; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  margin:16px 0 6px; }
.chip, .langbtn, .themechip {
  border:1px solid var(--line); background:var(--panel);
  backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
  color:var(--ink); border-radius:980px; padding:7px 16px; font:inherit;
  font-size:.8125rem; font-weight:500; cursor:pointer;
  transition:transform .25s var(--ease-out), background .2s var(--ease),
    border-color .2s var(--ease), box-shadow .25s var(--ease); }
.chip:hover, .themechip:hover, .langbtn:hover {
  transform:scale(1.03); border-color:var(--accent); }
.chip.on, .themechip.on {
  border-color:transparent; font-weight:600; color:#fff;
  background:var(--accent); box-shadow:0 4px 16px rgba(0,113,227,.28); }
@media (prefers-color-scheme: dark) {
  .chip.on, .themechip.on { box-shadow:0 4px 20px rgba(10,132,255,.35); } }
.themechip { font-size:.75rem; letter-spacing:.04em; text-transform:uppercase;
  opacity:.9; }
.langbtn { margin-left:auto; }
#themebar { margin-bottom:4px; }
#q { flex:1 1 200px; min-width:160px; font:inherit; font-size:.9rem;
  padding:10px 16px; border:1px solid var(--line); border-radius:14px;
  background:var(--panel); backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur)); color:var(--ink);
  transition:border-color .2s var(--ease), box-shadow .25s var(--ease); }
#q:focus { outline:none; border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(0,113,227,.15); }
main { max-width:1100px; margin:0 auto; padding:12px 24px 100px;
  display:grid; gap:28px; }
.mapwrap {
  background:var(--panel); backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--line); border-radius:24px; padding:22px 18px 14px;
  overflow-x:auto; box-shadow:var(--shadow); }
.mapnote { font-size:.78rem; color:var(--muted); margin:6px 6px 4px; line-height:1.4; }
svg text { fill:var(--ink); }
.axlab { font-size:11px; fill:var(--muted); }
.axtitle { font-size:10px; fill:var(--muted); letter-spacing:.08em;
  text-transform:uppercase; }
.dot { cursor:pointer; }
.dot circle.core { stroke:var(--panel-solid); stroke-width:2.5;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.15)); }
.dot.dv circle.ring { fill:none; stroke-dasharray:3 3; stroke-width:1.6; }
.dot.dim { opacity:.12; transition:opacity .35s var(--ease); }
.dot:focus { outline:none; }
.dot:focus circle.core, .dot:hover circle.core { stroke:var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .dot circle.core { transition:r .28s var(--ease-out), stroke .2s var(--ease),
    filter .25s var(--ease); }
  .dot:hover circle.core, .dot:focus circle.core {
    r:11; filter:drop-shadow(0 4px 14px rgba(0,0,0,.22)); }
  #panel { transition:transform .45s var(--ease-out); }
  #scrim { transition:opacity .35s var(--ease); }
  .card { transition:transform .3s var(--ease-out), background .2s var(--ease),
    box-shadow .3s var(--ease); }
  .card:hover { transform:translateY(-2px) scale(1.005);
    box-shadow:0 12px 28px rgba(0,0,0,.1); }
  .card.enter { animation:cardIn .5s var(--ease-out) both; }
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:none; }
}
.legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin:10px 6px 4px;
  font-size:.78rem; color:var(--muted); }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.swatch { width:10px; height:10px; border-radius:50%; display:inline-block;
  box-shadow:0 0 0 2px var(--panel-solid); }
#tip { position:fixed; pointer-events:none;
  background:rgba(29,29,31,.92); color:#F5F5F7; font-size:.8rem;
  padding:8px 12px; border-radius:12px; max-width:300px; opacity:0; z-index:40;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.25); transition:opacity .15s var(--ease);
  line-height:1.35; }
#cards { display:grid; gap:12px; }
.domain-block {
  background:var(--panel); backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line); border-radius:20px; overflow:hidden;
  box-shadow:var(--shadow); }
.domain-head {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  width:100%; text-align:left; border:0; background:transparent;
  color:var(--ink); font:inherit; padding:16px 18px; cursor:pointer;
  transition:background .2s var(--ease); }
.domain-head:hover { background:var(--mono-bg); }
.domain-head .chev {
  width:28px; height:28px; border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; font-size:.85rem;
  background:var(--mono-bg); color:var(--muted);
  transition:transform .3s var(--ease-out), background .2s; }
.domain-block.open .domain-head .chev { transform:rotate(90deg);
  background:var(--accent); color:#fff; }
.domain-head h2 { margin:0; font:600 1.15rem/1.2 -apple-system,BlinkMacSystemFont,
  "SF Pro Display",serif; letter-spacing:-.02em; flex:1; }
.domain-head .meta-row { display:flex; flex-wrap:wrap; gap:6px; width:100%;
  padding-left:40px; margin-top:2px; }
.domain-sum { color:var(--muted); font-size:.88rem; line-height:1.45;
  padding:0 18px 14px 58px; margin:0; display:none; }
.domain-block.open .domain-sum { display:block; }
.domain-body {
  display:grid; gap:8px; padding:0 12px 14px;
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .45s var(--ease-out), opacity .3s var(--ease),
    padding .3s var(--ease); }
.domain-block.open .domain-body {
  max-height:4000px; opacity:1; padding:4px 12px 16px; }
.card { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap;
  background:var(--panel-solid); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); border-left:4px solid; border-radius:14px;
  padding:12px 16px; cursor:pointer; }
.card:hover { background:var(--mono-bg); }
.card b { font-weight:600; letter-spacing:-.01em; }
.card .m { font-size:.72rem; color:var(--muted); margin-left:auto;
  font-family:ui-monospace,"SF Mono",Consolas,monospace; opacity:.85; }
@media (prefers-reduced-motion: reduce) {
  .domain-body { transition:none; }
  .domain-block:not(.open) .domain-body { max-height:none; opacity:1; }
}
#scrim { position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:15;
  opacity:0; pointer-events:none; backdrop-filter:blur(2px); }
#scrim.on { opacity:1; pointer-events:auto; }
#panel { position:fixed; top:0; right:0; height:100%; width:min(540px,96vw);
  background:var(--panel); backdrop-filter:blur(28px) saturate(1.4);
  -webkit-backdrop-filter:blur(28px) saturate(1.4);
  border-left:1px solid var(--line); z-index:20;
  transform:translateX(104%); overflow-y:auto; padding:28px 26px 80px;
  box-shadow:-24px 0 60px rgba(0,0,0,.2); }
#panel.open { transform:translateX(0); }
#panel h2 { font:600 1.45rem/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",serif;
  margin:10px 0 6px; letter-spacing:-.02em; text-wrap:balance; }
#panel h3 { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); margin:0 0 10px; font-weight:600; }
#panel ul { margin:4px 0; padding-left:18px; }
#panel li { margin:8px 0; font-size:.92rem; line-height:1.45; }
.p-sec { margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
  opacity:0; transform:translateY(14px); }
.p-sec.vis { opacity:1; transform:none;
  transition:opacity .55s var(--ease-out), transform .55s var(--ease-out); }
@media (prefers-reduced-motion: reduce) {
  .p-sec { opacity:1; transform:none; }
}
.meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.badge { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.72rem;
  background:var(--mono-bg); border-radius:8px; padding:3px 9px; color:var(--muted); }
.stbadge { font-weight:700; font-size:.75rem; letter-spacing:.04em;
  text-transform:uppercase; }
.dvbadge { font-size:.72rem; font-weight:700; border:1px solid currentColor;
  border-radius:8px; padding:2px 8px; }
.cond { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.74rem;
  color:var(--accent); display:block; font-weight:600; }
.note { color:var(--muted); }
.ref { font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:.7rem;
  color:var(--muted); }
.tier { font-size:.64em; font-weight:700; letter-spacing:.04em;
  border:1px solid currentColor; border-radius:4px; padding:0 5px; opacity:.75; }
#closep { float:right; border:1px solid var(--line); background:var(--mono-bg);
  color:var(--ink); border-radius:980px; font:inherit; font-size:.8rem;
  font-weight:500; padding:6px 14px; cursor:pointer;
  transition:transform .2s var(--ease-out), background .2s; }
#closep:hover { transform:scale(1.04); background:var(--panel-solid); }
.plinks { margin-top:24px; font-size:.88rem; display:flex; gap:18px;
  flex-wrap:wrap; font-weight:500; }
.rel { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.rel-item {
  display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  background:var(--mono-bg); cursor:pointer; text-align:left;
  font:inherit; color:inherit; width:100%;
  transition:background .2s var(--ease), transform .2s var(--ease); }
.rel-item:hover { background:var(--panel-solid); transform:translateX(2px); }
.rel-kind { font-size:.68rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--accent);
  font-family:ui-monospace,"SF Mono",Consolas,monospace; }
.rel-origin { font-size:.64rem; color:var(--muted); opacity:.85; }
.rel-note { width:100%; font-size:.82rem; color:var(--muted); line-height:1.4;
  margin:0; padding-left:2px; }
.inf-path { font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:.78rem; line-height:1.45; word-break:break-word; }
.inf-path button {
  border:0; background:transparent; color:var(--accent); font:inherit;
  cursor:pointer; padding:0 2px; text-decoration:underline;
  text-underline-offset:2px; }
.inf-meta { font-size:.75rem; color:var(--muted); margin-top:2px; }
/* R-Graph: ego network + reading paths */
.rgraph-wrap {
  background:var(--panel); backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--line); border-radius:24px; padding:18px 18px 14px;
  box-shadow:var(--shadow); }
.rgraph-head { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  margin-bottom:10px; }
.rgraph-head h2 { margin:0; font:600 1.05rem/1.2 -apple-system,BlinkMacSystemFont,
  "SF Pro Display",serif; letter-spacing:-.02em; flex:1; }
.rgraph-head .hint { font-size:.78rem; color:var(--muted); width:100%; margin:0; }
#rgraph-svg { width:100%; height:auto; display:block; max-height:360px;
  border-radius:16px; background:var(--mono-bg); }
.rgraph-empty { color:var(--muted); font-size:.9rem; padding:28px 12px; text-align:center; }
.rg-node { cursor:pointer; }
.rg-node circle { stroke:var(--panel-solid); stroke-width:2.5;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.12)); }
.rg-node:hover circle, .rg-node:focus circle { stroke:var(--ink); }
.rg-node text { font-size:10px; fill:var(--ink); pointer-events:none; }
.rg-center circle { stroke-width:3; }
.rg-edge { fill:none; stroke:var(--muted); stroke-width:1.4; opacity:.45; }
.rg-edge.supports { stroke:var(--est); }
.rg-edge.requires { stroke:var(--strong); }
.rg-edge.specializes { stroke:var(--accent); }
.rg-edge.tensions { stroke:var(--comp); }
.rg-edge.boundary { stroke:var(--spec); stroke-dasharray:4 3; }
.rg-edge.shares_source { stroke:var(--muted); stroke-dasharray:2 3; opacity:.35; }
.rg-edge-lab { font-size:9px; fill:var(--muted); }
.pathbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.pathchip { border:1px solid var(--line); background:var(--panel-solid);
  color:var(--ink); border-radius:12px; padding:8px 12px; font:inherit;
  font-size:.78rem; font-weight:500; cursor:pointer; text-align:left;
  transition:border-color .2s, transform .2s var(--ease); max-width:100%; }
.pathchip:hover { border-color:var(--accent); transform:scale(1.02); }
.pathchip.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--panel-solid)); }
.path-steps { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  margin-top:8px; }
.path-step {
  border:1px solid var(--line); background:var(--mono-bg); color:var(--ink);
  border-radius:980px; padding:5px 12px; font:inherit; font-size:.75rem;
  cursor:pointer; display:inline-flex; gap:6px; align-items:center;
  transition:background .2s, transform .2s; }
.path-step:hover, .path-step.on { background:var(--panel-solid);
  border-color:var(--accent); transform:scale(1.03); }
.path-arrow { color:var(--muted); font-size:.7rem; opacity:.6; user-select:none; }
.covnote { font-size:.72rem; color:var(--muted); margin:8px 4px 0; line-height:1.4; }
/* P-Shell top nav */
.topnav {
  display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
  max-width:1100px; margin:0 auto; padding:14px 24px 0; position:relative; z-index:2;
  font-size:.8rem; font-weight:500; }
.topnav a, .topnav button {
  color:var(--muted); text-decoration:none; border:0; background:none;
  font:inherit; font-weight:500; cursor:pointer; padding:4px 0; }
.topnav a:hover, .topnav button:hover { color:var(--accent); }
.topnav a.on { color:var(--accent); }
.topnav .sep { opacity:.3; user-select:none; }
.path-guide {
  font-size:.88rem; color:var(--muted); line-height:1.45; margin:8px 0 4px;
  padding:10px 12px; border-left:3px solid var(--accent); background:var(--mono-bg);
  border-radius:0 12px 12px 0; }
.qchips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
.qchip {
  border:1px dashed var(--line); background:transparent; color:var(--ink);
  border-radius:980px; padding:6px 12px; font:inherit; font-size:.75rem;
  cursor:pointer; }
.qchip:hover { border-color:var(--accent); color:var(--accent); }
.compare-wrap {
  background:var(--panel); border:1px solid var(--line); border-radius:20px;
  padding:14px 16px; box-shadow:var(--shadow); margin-top:4px; }
.compare-wrap h2 { margin:0 0 8px; font-size:1rem; }
.compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:640px) { .compare-grid { grid-template-columns:1fr; } }
.compare-slot {
  border:1px solid var(--line); border-radius:14px; padding:12px; min-height:88px;
  background:var(--mono-bg); font-size:.88rem; }
.compare-slot .pick { font-size:.75rem; color:var(--muted); }
.compare-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
/* P-Read tour */
#tour {
  position:fixed; inset:0; z-index:50; display:none; align-items:center;
  justify-content:center; padding:20px;
  background:rgba(0,0,0,.45); backdrop-filter:blur(6px); }
#tour.on { display:flex; }
.tour-card {
  width:min(420px, 100%); background:var(--panel-solid); color:var(--ink);
  border-radius:20px; padding:22px 22px 16px; box-shadow:var(--shadow);
  border:1px solid var(--line); }
.tour-card h2 { margin:0 0 8px; font-size:1.2rem; letter-spacing:-.02em; }
.tour-card p { margin:0 0 14px; color:var(--muted); font-size:.92rem; line-height:1.45; }
.tour-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.tour-dotbar { display:flex; gap:6px; margin:0 0 12px; }
.tour-dotbar i { width:7px; height:7px; border-radius:50%; background:var(--line); display:block; }
.tour-dotbar i.on { background:var(--accent); }
.panel-tools { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
.panel-tools button {
  border:1px solid var(--line); background:var(--mono-bg); color:var(--ink);
  border-radius:980px; font:inherit; font-size:.72rem; padding:4px 10px; cursor:pointer; }
.panel-tools button.on { background:var(--accent); color:#fff; border-color:transparent; }
.howto-link { font-size:.78rem; margin:0 6px 8px; }
footer { max-width:1100px; margin:0 auto; padding:0 24px 56px;
  font-size:.8rem; color:var(--muted); line-height:1.5; position:relative; z-index:1; }
button:focus-visible, .dot:focus-visible, a:focus-visible, #q:focus-visible {
  outline:2px solid var(--accent); outline-offset:3px; }
@media (max-width:640px) {
  h1 { font-size:1.75rem; }
  header { padding-top:16px; }
  #panel { width:100%; max-width:100%; }
}
</style>
</head>
<body>
<nav class="topnav" id="topnav" aria-label="primary"></nav>
<header>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <div class="toolbar" id="themebar"></div>
  <div class="toolbar" id="topicbar"></div>
  <div class="toolbar">
    <input id="q" type="search">
    <button class="langbtn" id="soundbtn" type="button" aria-pressed="false"></button>
    <button class="langbtn" id="langbtn"></button>
    <button class="langbtn" id="tourbtn" type="button"></button>
  </div>
</header>
<main>
  <div class="qchips" id="qchips" aria-label="questions"></div>
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 720 470" role="img"></svg>
    <div class="legend" id="legend"></div>
    <p class="mapnote" id="mapnote"></p>
    <p class="howto-link"><a href="about.html#how-to-read" id="howto-a"></a></p>
  </div>
  <section class="rgraph-wrap" id="rgraph-section" aria-label="relation graph">
    <div class="rgraph-head">
      <h2 id="rgraph-title"></h2>
      <p class="hint" id="rgraph-hint"></p>
    </div>
    <div class="pathbar" id="pathbar"></div>
    <div class="path-guide" id="pathguide" hidden></div>

let DATA = null;
let state = {
  lang:"en", theme:"", topic:"", q:"", sel:null, openDomains:{},

/* Measure channel: opt-in only (?measure=1 or localStorage ue_measure=1).
   Records expand events as a list you can recount — never a confidence score. */
const Measure = (() => {
  const on = /(?:\?|&)measure=1(?:&|$)/.test(location.search)
    || (typeof localStorage !== "undefined" && localStorage.getItem("ue_measure") === "1");
  const log = [];
  function rec(event, detail) {
    if (!on) return;
    const row = Object.assign({ t: Date.now(), event }, detail || {});
    log.push(row);
  }
  const api = {
    enabled: on,
    rec,
    snapshot() { return log.slice(); },
    count(event) { return log.filter(x => x.event === event).length; },
    n() { return log.length; },
  };
  if (on && typeof window !== "undefined") window.__UE_MEASURE__ = api;
  return api;
})();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = () => I18N[state.lang];
const cf = (c, f) => state.lang === "zh" ? c[f + "_zh"] : c[f];
const topicMeta = id => (DATA.topics || []).find(t => t.id === id) || {};

function visible() {
  const q = state.q.toLowerCase();
  return DATA.claims.filter(c => {
    const tm = topicMeta(c.topic);
    if (state.theme && tm.theme !== state.theme) return false;
    if (state.topic && c.topic !== state.topic) return false;
    if (q && !(c.title + " " + c.title_zh + " " + c.id + " " + c.topic)
         .toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ---------------- map ---------------- */
const GEO = { left:96, top:34, cw:118, ch:76, r:8 };
const OFF = [[0,0],[-26,0],[26,0],[0,-22],[0,22],[-26,-22],[26,-22],[-26,22],[26,22]];

function renderMap() {
  const vis = new Set(visible().map(c => c.id));
  const g = GEO, axes = ["E1","E2","E3","E4","E5"];
  let s = "";
  // divergence corner: high consensus (x 0-1) x weak evidence (y 2-4)
  s += `<rect x="${g.left}" y="${g.top + 2*g.ch}" width="${2*g.cw}" height="${3*g.ch}"
        fill="var(--divzone)" rx="8"></rect>`;
  for (let i = 0; i < 5; i++) {
    // diagonal band cells
    s += `<rect x="${g.left + i*g.cw}" y="${g.top + i*g.ch}" width="${g.cw}"
          height="${g.ch}" fill="var(--band)" rx="8"></rect>`;
    const st = DATA.claims.find(c => c.status_rank === i);
    const name = st ? (state.lang === "zh" ? st.status_name_zh : st.status_name)
                    : STATUS_ORDER[i];
    s += `<text class="axlab" x="${g.left + i*g.cw + g.cw/2}" y="${g.top - 12}"
          text-anchor="middle">${esc(name)}</text>`;
    const ax = DATA.claims.find(c => c.axis_rank === i);
    const axname = ax ? (state.lang === "zh" ? ax.axis_name_zh : ax.axis_name) : "";
    s += `<text class="axlab" x="${g.left - 10}" y="${g.top + i*g.ch + g.ch/2 - 6}"
          text-anchor="end">${axes[i]}</text>`;
    s += `<text class="axlab" x="${g.left - 10}" y="${g.top + i*g.ch + g.ch/2 + 9}"
          text-anchor="end" opacity=".65" font-size="9.5">${esc(axname.slice(0, 14))}</text>`;
  }
  s += `<text class="axtitle" x="${g.left + 2.5*g.cw}" y="${g.top + 5*g.ch + 26}"
        text-anchor="middle">${esc(L().xaxis)}</text>`;
  s += `<text class="axtitle" transform="rotate(-90 14 ${g.top + 2.5*g.ch})"
        x="14" y="${g.top + 2.5*g.ch}" text-anchor="middle">${esc(L().yaxis)}</text>`;
  s += `<text class="axlab" x="${g.left + g.cw}" y="${g.top + 4.55*g.ch}"
        text-anchor="middle" opacity=".8">⚡</text>`;

  const cells = {};
  for (const c of DATA.claims) {
    const key = c.status_rank + "," + c.axis_rank;
    (cells[key] = cells[key] || []).push(c);
  }
  for (const key in cells) {
    const [xr, yr] = key.split(",").map(Number);
    cells[key].forEach((c, i) => {
      const [dx, dy] = OFF[i % OFF.length];
      const x = g.left + xr*g.cw + g.cw/2 + dx;
      const y = g.top + yr*g.ch + g.ch/2 + dy;
      const dim = vis.has(c.id) ? "" : " dim";
      const dv = c.diverges ? " dv" : "";
      s += `<g class="dot${dv}${dim}" tabindex="0" role="button" data-id="${esc(c.id)}"
            aria-label="${esc(cf(c,"title"))} — ${esc(cf(c,"status_name"))}, ${esc(c.axis)}">`;
      if (c.diverges) s += `<circle class="ring" cx="${x}" cy="${y}" r="${g.r+4}"
            stroke="${COLORS[c.status]}"></circle>`;
      s += `<circle class="core" cx="${x}" cy="${y}" r="${g.r}"
            fill="${COLORS[c.status]}"></circle></g>`;
    });
  }
  $("map").innerHTML = s;

  $("map").querySelectorAll(".dot").forEach(el => {
    const c = DATA.claims.find(x => x.id === el.dataset.id);
    el.addEventListener("click", () => openPanel(c));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(c); }});
    el.addEventListener("mousemove", e => {
      const tip = $("tip");
      tip.innerHTML = `${c.status_light} ${esc(cf(c,"title"))}<br>
        <span style="opacity:.75">${esc(c.axis)} · ${esc(c.topic)}${c.diverges ? " · ⚡" : ""}</span>`;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px";
      tip.style.top = (e.clientY + 14) + "px";
      tip.style.opacity = 1; });
    el.addEventListener("mouseleave", () => $("tip").style.opacity = 0);
  });
}

/* ---------------- cards (domain accordion → claims) ---------------- */
function claimCardHTML(c, i) {
  return `<div class="card enter" style="border-left-color:${COLORS[c.status]};animation-delay:${Math.min(i, 12) * 0.03}s"
       data-id="${esc(c.id)}" tabindex="0" role="button">
    <span>${c.status_light}</span><b>${esc(cf(c,"title"))}</b>
    ${c.diverges ? "<span>⚡</span>" : ""}
    <span class="m">${esc(c.axis)}${c.diverges ? " · ⚡" : ""}</span>
  </div>`;
}
function bindClaimCards(root) {
  root.querySelectorAll(".card").forEach(el => {
    const c = DATA.claims.find(x => x.id === el.dataset.id);
    el.addEventListener("click", e => { e.stopPropagation(); openPanel(c); });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); openPanel(c); }});
  });
}
function renderCards() {
  const t = L();
  const list = visible();
  const byTopic = {};
  for (const c of list) (byTopic[c.topic] = byTopic[c.topic] || []).push(c);

  // Which domain blocks to show
  let topics = (DATA.topics || []).filter(tp => {
    if (state.theme && tp.theme !== state.theme) return false;
    if (state.topic && tp.id !== state.topic) return false;
    return byTopic[tp.id] && byTopic[tp.id].length;
  });
  // Search may surface claims from hidden topics
  for (const tid of Object.keys(byTopic)) {
    if (!topics.find(x => x.id === tid)) {
      const tp = topicMeta(tid);
      if (tp.id) topics.push(tp);
    }
  }

  // Auto-expand: selected topic, or single domain in view, or previously open
  if (state.topic) state.openDomains[state.topic] = true;
  if (topics.length === 1) state.openDomains[topics[0].id] = true;

  if (!topics.length) {
    $("cards").innerHTML = `<p class="mapnote">${esc(t.openDomain)}</p>`;
    return;
  }

  let html = "";
  if (!state.topic && !state.q) {
    html += `<p class="mapnote" style="margin:0 0 4px">${esc(t.openDomain)}</p>`;
  }
  topics.forEach((tp, di) => {
    const claims = byTopic[tp.id] || [];
    const open = !!state.openDomains[tp.id];
    const title = state.lang === "zh" ? (tp.title_zh || tp.title) : tp.title;
    const sum = state.lang === "zh" ? (tp.summary_zh || tp.summary) : tp.summary;
    const lights = claims.map(c => c.status_light).join("");
    html += `<section class="domain-block${open ? " open" : ""} enter"
      style="animation-delay:${Math.min(di, 8) * 0.04}s" data-domain="${esc(tp.id)}">
      <button type="button" class="domain-head" aria-expanded="${open}"
        data-domain="${esc(tp.id)}">
        <span class="chev" aria-hidden="true">›</span>
        <h2>${esc(title)} <span class="m" style="margin-left:8px;font-weight:500">${claims.length} ${esc(t.claimsWord)}</span></h2>
        <div class="meta-row"><span class="dots" style="letter-spacing:2px;font-size:1.1em">${lights}</span></div>
      </button>
      <p class="domain-sum">${esc(sum || "")}</p>
      <div class="domain-body" role="region">
        ${claims.map((c, i) => claimCardHTML(c, i)).join("")}
      </div>
    </section>`;
  });
  $("cards").innerHTML = html;

  $("cards").querySelectorAll(".domain-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.domain;
      const block = btn.closest(".domain-block");
      const willOpen = !block.classList.contains("open");
      state.openDomains[id] = willOpen;
      // optional: set topic filter when expanding from "all"
      if (willOpen && !state.topic) {
        /* keep all domains visible; just expand this one */
      }
      block.classList.toggle("open", willOpen);
      btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      const nCards = block.querySelectorAll(".domain-body .card").length;
      Measure.rec("domain_expand", {
        id, open: willOpen, n_claims: nCards,
        topic_filter: state.topic || "",
        lang: state.lang,
      });
      AudioFX.unlock();
      if (willOpen) AudioFX.blip();
    });
  });
  bindClaimCards($("cards"));
}

/* ---------------- panel + soft SFX (muted by default) ---------------- */
const AudioFX = (() => {
  let ctx = null, master = null, muted = true, drone = null;
  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
  }
  function setMuted(m) {
    muted = m;
    ensure();
    if (!master || !ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(muted ? 0 : 0.09, t, 0.08);
    if (!muted) startDrone(); else stopDrone();
  }
  function startDrone() {
    if (!ctx || drone || muted) return;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    o1.type = "sine"; o2.type = "sine";
    o1.frequency.value = 55; o2.frequency.value = 82.5;
    f.type = "lowpass"; f.frequency.value = 280;
    g.gain.value = 0.045;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
    o1.start(); o2.start();
    drone = { o1, o2, g, f };
  }

    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.18);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

    isMuted: () => muted,

/* ---------------- R-Graph: ego neighbourhood + reading paths ---------------- */
function claimById(id) {
  return (DATA.claims || []).find(c => c.id === id) || null;
}
function kindColorClass(kind) {
  const k = (kind || "").replace("supported_by", "supports")
    .replace("required_by", "requires")
    .replace("generalizes", "specializes");
  if (["supports", "requires", "specializes", "tensions", "boundary", "shares_source"].includes(k))
    return k;
  return "";
}
function buildEgoGraph(centerId) {
  const c = claimById(centerId);
  if (!c) return null;
  const rel = c.related || [];
  const seen = new Set();
  const neigh = [];
  for (const r of rel) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    neigh.push(r);
    if (neigh.length >= 14) break;
  }
  const nodes = [{ id: centerId, role: "center", claim: c, x: 0, y: 0 }];
  const n = Math.max(neigh.length, 1);
  neigh.forEach((r, i) => {
    const ang = (2 * Math.PI * i / n) - Math.PI / 2;
    nodes.push({
      id: r.id, role: "neighbor", related: r,
      claim: claimById(r.id),
      x: Math.cos(ang), y: Math.sin(ang),
    });
  });
  // edges: use related rows (from center) + reverse for undirected draw
  const edges = rel.filter(r => seen.has(r.id)).map(r => ({
    source: centerId,
    target: r.id,
    kind: r.kind,
    kind_label_en: r.kind_label_en,
    kind_label_zh: r.kind_label_zh,
    note: r.note,
    origin: r.origin,
    direction: r.direction,
  }));
  return { center: centerId, nodes, edges };
}
function renderRelationGraph() {
  const t = L();
  const zh = state.lang === "zh";
  $("rgraph-title").textContent = t.rgraphTitle;
  $("rgraph-hint").textContent = t.rgraphHint;
  // coverage line
  const cov = (DATA.relations && DATA.relations.coverage) || {};
  if (cov.n_claims != null) {
    $("rgraph-cov").textContent = t.coverageLine
      .replace("{a}", String(cov.n_with_authored_edge ?? "?"))
      .replace("{n}", String(cov.n_claims))
      .replace("{i}", String(cov.n_isolated_authored ?? "?"))
      .replace("{p}", String(cov.n_reading_paths ?? (DATA.relations.reading_paths || []).length));
  } else {
    $("rgraph-cov").textContent = "";
  }
  renderPathBar();
  const focus = state.graphFocus || (state.sel && state.sel.id) || null;
  const svg = $("rgraph-svg");
  const empty = $("rgraph-empty");
  if (!focus) {
    svg.innerHTML = "";
    svg.setAttribute("hidden", "");
    empty.hidden = false;
    empty.textContent = t.rgraphEmpty;
    return;
  }
  const g = buildEgoGraph(focus);
  if (!g || g.nodes.length <= 1) {
    svg.innerHTML = "";
    svg.removeAttribute("hidden");
    // still draw center alone
    if (g && g.nodes.length === 1) {
      empty.hidden = true;
      drawEgoSvg(g, t, zh);
    } else {
      empty.hidden = false;
      empty.textContent = t.rgraphNoEdges;
      svg.setAttribute("hidden", "");
    }
    return;
  }
  empty.hidden = true;
  svg.removeAttribute("hidden");
  drawEgoSvg(g, t, zh);
}
function drawEgoSvg(g, t, zh) {
  const W = 640, H = 320, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34;
  const pos = {};
  for (const n of g.nodes) {
    pos[n.id] = n.role === "center"
      ? { x: cx, y: cy }
      : { x: cx + n.x * R, y: cy + n.y * R };
  }
  let html = "";
  // edges first
  for (const e of g.edges) {
    const a = pos[e.source] || pos[g.center];
    const b = pos[e.target];
    if (!a || !b) continue;
    const cls = kindColorClass(e.kind);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const lab = zh ? (e.kind_label_zh || e.kind) : (e.kind_label_en || e.kind);
    html += `<line class="rg-edge ${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}">
      <title>${esc(lab)}: ${esc(e.note || "")}</title></line>`;
    html += `<text class="rg-edge-lab" x="${mx}" y="${my - 4}" text-anchor="middle">${esc(lab)}</text>`;
  }
  for (const n of g.nodes) {
    const p = pos[n.id];
    const cl = n.claim || claimById(n.id);
    const col = cl ? (COLORS[cl.status] || "var(--muted)") : "var(--muted)";
    const light = cl ? cl.status_light : (n.related && n.related.status_light) || "";
    const title = cl ? (zh ? (cl.title_zh || cl.title) : cl.title)
      : (n.related && n.related.title) || n.id;
    const short = title.length > 28 ? title.slice(0, 26) + "…" : title;
    const r = n.role === "center" ? 16 : 11;
    html += `<g class="rg-node${n.role === "center" ? " rg-center" : ""}" tabindex="0" role="button"
      data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <title>${esc(light + " " + title)}</title>
      <circle r="${r}" fill="${col}" class="core"/>
      <text y="${r + 12}" text-anchor="middle">${esc(light + " " + short)}</text>
    </g>`;
  }
  const svg = $("rgraph-svg");
  svg.innerHTML = html;
  svg.querySelectorAll(".rg-node").forEach(el => {
    const go = () => {
      const id = el.dataset.id;
      const c = claimById(id);
      if (!c) return;
      state.graphFocus = id;
      Measure.rec("relation_nav", {
        from: g.center, to: id, surface: "rgraph",
      });
      openPanel(c);
      renderRelationGraph();
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

      ${c.diverges ? " · ⚡" : ""}</div>
      <button type="button" class="chip" data-open="${esc(c.id)}" style="margin-top:8px">${esc(t.simple)} →</button>`;
    el.querySelector("[data-open]")?.addEventListener("click", () => openPanel(c));
  };
  fill($("compare-a"), state.compareA, t.comparePhA);
  fill($("compare-b"), state.compareB, t.comparePhB);
}
function showTour(step) {
  const t = L();
  const steps = t.tour || [];
  if (!steps.length) return;
  state.tourStep = Math.max(0, Math.min(step, steps.length - 1));
  const s = steps[state.tourStep];
  $("tour-h").textContent = s.h;
  $("tour-p").textContent = s.p;
  $("tour-dots").innerHTML = steps.map((_, i) =>
    `<i class="${i === state.tourStep ? "on" : ""}"></i>`).join("");
  $("tour-skip").textContent = t.tourSkip;
  $("tour-next").textContent =
    state.tourStep >= steps.length - 1 ? t.tourDone : t.tourNext;
  $("tour").classList.add("on");
  Measure.rec("tour_step", { step: state.tourStep });
}
function endTour() {
  $("tour").classList.remove("on");
  try { localStorage.setItem("ue_tour_done", "1"); } catch (_) {}
}
function maybeStartTour() {
  const params = new URLSearchParams(location.search);
  if (params.get("tour") === "0") return;
  if (params.get("tour") === "1") { showTour(0); return; }
  try {
    if (localStorage.getItem("ue_tour_done") === "1") return;
  } catch (_) {}
  showTour(0);
}
function applyDeepLink() {
  const params = new URLSearchParams(location.search);
  const c = params.get("c");
  const path = params.get("path");
  if (path) {
    state.activePath = path;
    state.pathStep = 0;
  }
  if (c) {
    const claim = claimById(c);
    if (claim) {
      Measure.rec("deep_link_open", { id: c });
      if (claim.topic) {
        state.openDomains[claim.topic] = true;
      }
      openPanel(claim);
    }
  } else if (path) {
    renderRelationGraph();
  }
}

/* ---------------- chrome ---------------- */
function renderChrome() {
  const t = L();
  document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
  document.title = t.title;
  $("t-title").textContent = t.title;
  $("t-sub").textContent = t.sub;
  $("q").placeholder = t.search;
  $("q").setAttribute("aria-label", t.search);
  $("langbtn").textContent = t.lang;
  $("tourbtn").textContent = "ⓘ " + t.tourBtn;
  $("soundbtn").textContent = AudioFX.isMuted() ? "🔇 " + t.soundOff : "🔊 " + t.soundOn;
  $("soundbtn").setAttribute("aria-pressed", AudioFX.isMuted() ? "false" : "true");
  $("mapnote").textContent = t.note;
  $("howto-a").textContent = t.howto;
  $("howto-a").href = (state.lang === "zh" ? "about-zh.html" : "about.html") + "#how-to-read";
  $("foot").innerHTML = t.foot;
  renderTopNav();
  renderQChips();
  renderCompare();
  const themes = DATA.themes || [
    {id:"cosmos", title:"Cosmos", title_zh:"宇宙"},
    {id:"planets", title:"Planets", title_zh:"星球"},
    {id:"earth", title:"Earth", title_zh:"地球"},
  ];
  const tbar = [`<button class="themechip${state.theme ? "" : " on"}" data-th="">${esc(t.allThemes)}</button>`];
  for (const th of themes) {
    const lab = state.lang === "zh" ? th.title_zh : th.title;
    tbar.push(`<button class="themechip${state.theme === th.id ? " on" : ""}"
      data-th="${esc(th.id)}">${esc(lab)}</button>`);
  }
  $("themebar").innerHTML = tbar.join("");
  $("themebar").querySelectorAll(".themechip").forEach(b =>
    b.addEventListener("click", () => {
      state.theme = b.dataset.th || "";
      if (state.topic) {
        const tm = topicMeta(state.topic);
        if (state.theme && tm.theme !== state.theme) state.topic = "";
      }
      renderAll();
    }));
  const domainTopics = (DATA.topics || []).filter(tp =>
    !state.theme || tp.theme === state.theme);
  const bar = [`<button class="chip${state.topic ? "" : " on"}" data-t="">${esc(t.all)}</button>`];
  for (const tp of domainTopics) {
    const n = tp.n_claims != null ? ` · ${tp.n_claims}` : "";
    bar.push(`<button class="chip${state.topic === tp.id ? " on" : ""}"
      data-t="${esc(tp.id)}">${esc(state.lang === "zh" ? tp.title_zh : tp.title)}${n}</button>`);
  }
  $("topicbar").innerHTML = bar.join("");
  $("topicbar").querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {
      const id = b.dataset.t || "";
      state.topic = id;
      if (id) state.openDomains[id] = true;
      Measure.rec("domain_chip", {
        id: id || "(all)",
        open: id ? true : !!state.openDomains[id],
      });
      renderAll();
      // scroll to expanded domain block
      if (id) {
        requestAnimationFrame(() => {
          const el = document.querySelector(`.domain-block[data-domain="${CSS.escape(id)}"]`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
    }));
  const seen = new Set();
  $("legend").innerHTML = DATA.claims
    .filter(c => !seen.has(c.status) && seen.add(c.status))
    .sort((a, b) => a.status_rank - b.status_rank)
    .map(c => `<span><i class="swatch" style="background:${COLORS[c.status]}"></i>
      ${esc(cf(c,"status_name"))}</span>`).join("");
}

function renderAll() {
  renderChrome();
  renderMap();
  renderCards();
  renderRelationGraph();
}

$("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderMap(); renderCards(); });
$("soundbtn").addEventListener("click", () => {
  AudioFX.unlock();
  AudioFX.toggle();
  const t = L();
  $("soundbtn").textContent = AudioFX.isMuted() ? "🔇 " + t.soundOff : "🔊 " + t.soundOn;
  $("soundbtn").setAttribute("aria-pressed", AudioFX.isMuted() ? "false" : "true");
});
$("langbtn").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  renderAll();
  if (state.sel) openPanel(state.sel);
});
$("tourbtn").addEventListener("click", () => showTour(0));
$("tour-skip").addEventListener("click", endTour);
$("tour-next").addEventListener("click", () => {
  const n = (L().tour || []).length;
  if (state.tourStep >= n - 1) endTour();
  else showTour(state.tourStep + 1);
});
$("compare-clear").addEventListener("click", () => {
  state.compareA = null; state.compareB = null; renderCompare();
});
$("compare-use-sel").addEventListener("click", () => {
  if (!state.sel) return;
  if (!state.compareA) state.compareA = state.sel.id;
  else state.compareB = state.sel.id;
  renderCompare();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("tour").classList.contains("on")) endTour();
    else closePanel();
  }
});
$("scrim").addEventListener("click", closePanel);
document.addEventListener("click", e => {
  if ($("tour").classList.contains("on")) return;
  if (state.sel && !$("panel").contains(e.target)
      && !e.target.closest(".dot") && !e.target.closest(".card")
      && !e.target.closest(".path-step") && !e.target.closest(".rg-node")
      && !e.target.closest(".qchip") && !e.target.closest(".pathchip")
      && e.target.id !== "scrim") closePanel();
});

fetch("app-data.json").then(r => r.json()).then(d => {
  DATA = d;
  renderAll();
  applyDeepLink();
  maybeStartTour();
  document.body.classList.add("ready");
});
</script>
</body>
</html>
